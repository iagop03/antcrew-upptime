name: Summary CI
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Upptime
        uses: upptime/uptime-monitor@master
        with:
          UPPTIME_GH_TOKEN: ${{ secrets.UPPTIME_GH_TOKEN }}
          TYPE: summary
