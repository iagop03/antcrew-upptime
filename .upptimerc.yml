owner: iagop03
repo: antcrew-upptime

sites:
  - name: Platform INT
    url: https://platform-int.antcrew.org/health
    expectedResponseTime: 8000

status-website:
  cname: status.antcrew.org
  name: antcrew status
  theme: dark
  introTitle: All systems operational
  introMessage: Real-time availability for antcrew services.
  navbar:
    - title: Status
      href: /
    - title: Platform
      href: https://antcrew.org
    - title: Docs
      href: https://docs.antcrew.org
  customCss: |
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    :root {
      --body-background-color: #030712;
      --card-background-color: #111827;
      --nav-background-color: rgba(3,7,18,0.97);
      --nav-border-bottom-color: rgba(31,41,55,0.8);
      --nav-current-border-bottom-color: #818cf8;
      --card-border-color: rgba(31,41,55,0.8);
      --body-text-color: #f3f4f6;
      --up-border-left-color: #34d399;
      --tag-up-background-color: #065f46;
      --tag-up-color: #34d399;
      --down-border-left-color: #f87171;
      --down-background-color: #3b0a0a;
      --tag-down-background-color: #7f1d1d;
      --tag-down-color: #f87171;
      --degraded-border-left-color: #fbbf24;
      --tag-degraded-background-color: #78350f;
      --tag-degraded-color: #fbbf24;
      --error-button-background-color: #4338ca;
      --error-button-border-color: #3730a3;
      --submit-button-background-color: #4338ca;
      --submit-button-border-color: #3730a3;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #030712;
    }

    nav {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    nav a.logo, nav .logo {
      font-family: monospace;
      font-weight: 700;
      font-size: 1rem;
      color: #818cf8 !important;
      letter-spacing: -0.01em;
    }

    nav a:not(.logo) {
      font-size: 0.8rem;
      font-weight: 500;
      color: #6b7280 !important;
      transition: color 0.1s;
    }

    nav a:not(.logo):hover {
      color: #e5e7eb !important;
    }

    .container {
      max-width: 760px;
    }

    .container > h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #f3f4f6;
      margin-bottom: 0.25rem;
    }

    .container > p {
      font-size: 0.83rem;
      color: #6b7280;
      margin-top: 0;
    }

    article {
      background: #111827 !important;
      border: 1px solid rgba(31,41,55,0.8) !important;
      border-radius: 0.75rem !important;
      padding: 0.9rem 1.1rem !important;
      transition: border-color 0.15s;
    }

    article:hover {
      border-color: rgba(55,65,81,0.9) !important;
    }

    article h2 {
      font-size: 0.875rem;
      font-weight: 500;
      color: #e5e7eb;
      letter-spacing: 0;
    }

    article .badge, article span[class*="tag"] {
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.6rem;
    }

    /* Response time bars */
    .graph rect {
      rx: 2;
    }

    /* Footer */
    footer, footer a {
      font-size: 0.75rem;
      color: #374151 !important;
    }

    footer a:hover {
      color: #6b7280 !important;
    }

    /* Scrollbar */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(31,41,55,1) transparent;
    }
